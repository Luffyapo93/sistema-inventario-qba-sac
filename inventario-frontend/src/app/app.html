@if (authService.estaAutenticado()) {
  <div class="flex h-screen bg-background">
    <app-sidebar></app-sidebar>
    
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <!-- Topbar -->
      <header class="h-16 border-b border-border bg-card flex items-center justify-between px-8 shrink-0 shadow-sm z-10">
        <div class="flex items-center gap-3">
          <div class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
          <span class="text-sm font-semibold text-muted-foreground tracking-tight">
            QBA SAC — <span class="text-foreground">Sincronizado con My Company</span>
          </span>
        </div>
        
        <div class="flex items-center gap-4">
          <div class="h-8 w-px bg-border mx-2"></div>
          <div class="flex flex-col items-end">
            <span class="text-xs font-bold text-primary uppercase tracking-widest">Perfil Activo</span>
            <span class="text-[11px] font-medium text-muted-foreground">{{ authService.usuarioActual()?.rolEtiqueta }}</span>
          </div>
        </div>
      </header>

      <!-- Main Content Area -->
      <main class="flex-1 overflow-y-auto bg-muted/20">
        <div class="p-8 max-w-[1600px] mx-auto">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </div>
} @else {
  <router-outlet></router-outlet>
}
