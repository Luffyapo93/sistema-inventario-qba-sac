<aside class="aurora-shell" [class.collapsed]="colapsado" *ngIf="authService.usuarioActual() as user">
  <div class="aurora-glass">
    <!-- Columna Principal del Menú -->
    <div class="aurora-main">
      <!-- Header Workspace -->
      <div class="aurora-header">
        <div class="aurora-logo" (click)="toggleColapso()" title="Expandir/Contraer menú">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>

        <div class="aurora-brand" *ngIf="!colapsado">
          <strong>QBA SAC</strong>
          <span>Inventario workspace</span>
        </div>

        <button type="button" class="btn-collapse" *ngIf="!colapsado" (click)="toggleColapso()" title="Contraer barra">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
      </div>

      <!-- Search Pill -->
      <div class="aurora-search" *ngIf="!colapsado">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" [(ngModel)]="filtroRapido" placeholder="Buscar módulo...">
        <kbd>⌘K</kbd>
      </div>
      <button type="button" class="dock-btn" *ngIf="colapsado" (click)="toggleColapso()" title="Buscar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>

      <!-- Navegación Principal -->
      <nav class="aurora-nav">
        <a routerLink="/dashboard" routerLinkActive="is-active" class="aurora-item" title="Dashboard Stock">
          <span class="item-ico">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>
            </svg>
          </span>
          <span class="item-lbl" *ngIf="!colapsado">Dashboard</span>
        </a>

        <a *ngIf="puedeVer(['Administrador', 'JefeAlmacen'])" routerLink="/productos" routerLinkActive="is-active" class="aurora-item" title="Catálogo y Stock">
          <span class="item-ico">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            </svg>
          </span>
          <span class="item-lbl" *ngIf="!colapsado">Catálogo</span>
        </a>

        <a *ngIf="puedeVer(['Administrador', 'JefeAlmacen', 'AsistenteAlmacen', 'Vendedor'])" routerLink="/traslados" routerLinkActive="is-active" class="aurora-item" title="Traslados entre Sedes">
          <span class="item-ico">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>
            </svg>
          </span>
          <span class="item-lbl" *ngIf="!colapsado">Traslados</span>
        </a>

        <a *ngIf="puedeVer(['Administrador', 'JefeAlmacen', 'Compras', 'Gerencia'])" routerLink="/kardex" routerLinkActive="is-active" class="aurora-item" title="Kardex Valorizado">
          <span class="item-ico">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
            </svg>
          </span>
          <span class="item-lbl" *ngIf="!colapsado">Kardex</span>
        </a>

        <a *ngIf="puedeVer(['Administrador', 'JefeAlmacen', 'Compras', 'Gerencia'])" routerLink="/reportes" routerLinkActive="is-active" class="aurora-item" title="Alertas y Órdenes">
          <span class="item-ico">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/>
            </svg>
          </span>
          <span class="item-lbl" *ngIf="!colapsado">Alertas</span>
          <span class="amber-count" *ngIf="!colapsado">3</span>
        </a>

        <a *ngIf="puedeVer(['Administrador'])" routerLink="/usuarios" routerLinkActive="is-active" class="aurora-item" title="Usuarios y Roles">
          <span class="item-ico">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </span>
          <span class="item-lbl" *ngIf="!colapsado">Usuarios</span>
        </a>
      </nav>

      <!-- Sección SEDES / ÁREAS -->
      <div class="aurora-projects">
        <div class="proj-head" *ngIf="!colapsado">
          <span>SEDES & ÁREAS</span>
          <a routerLink="/integracion" title="Sincronizar My Company">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </a>
        </div>

        <a routerLink="/full-tecnologia" routerLinkActive="is-active-dot" class="proj-item" title="Tienda Full Tecnología">
          <span class="dot yellow"></span>
          <span class="proj-name" *ngIf="!colapsado">Full Tecnología</span>
          <span class="proj-num" *ngIf="!colapsado">12</span>
        </a>

        <a routerLink="/dahua-camaras" routerLinkActive="is-active-dot" class="proj-item" title="Tienda Dahua Cámaras">
          <span class="dot green"></span>
          <span class="proj-name" *ngIf="!colapsado">Dahua Cámaras</span>
          <span class="proj-num" *ngIf="!colapsado">8</span>
        </a>

        <a routerLink="/soporte-tecnico" routerLinkActive="is-active-dot" class="proj-item" title="Soporte Técnico">
          <span class="dot pink"></span>
          <span class="proj-name" *ngIf="!colapsado">Soporte Técnico</span>
          <span class="proj-num" *ngIf="!colapsado">5</span>
        </a>
      </div>

      <!-- Footer: Sincronización + Perfil -->
      <div class="aurora-footer">
        <div class="pro-card" [class.mini]="colapsado">
          <div class="pro-ring">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2.2">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/>
            </svg>
          </div>
          <div class="pro-info" *ngIf="!colapsado">
            <strong>My Company</strong>
            <small>98% sincronizado</small>
          </div>
          <a routerLink="/integracion" class="btn-upgrade" *ngIf="!colapsado">Sync</a>
        </div>

        <div class="profile-row" (click)="cerrarSesion()" title="Cerrar sesión o cambiar rol">
          <div class="avatar-amber">
            {{ user.iniciales }}
            <span class="status-green"></span>
          </div>
          <div class="profile-text" *ngIf="!colapsado">
            <strong>{{ user.nombreCompleto }}</strong>
            <small>{{ user.rolEtiqueta }}</small>
          </div>
          <span class="dots" *ngIf="!colapsado">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
            </svg>
          </span>
        </div>
      </div>
    </div>

    <!-- Riel Lateral Blanco Derecho -->
    <div class="aurora-rail" *ngIf="!colapsado">
      <a routerLink="/dashboard" class="rail-btn active-rail" title="Vista General">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>
        </svg>
      </a>
      <a routerLink="/productos" class="rail-btn" title="Catálogo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </a>
      <a routerLink="/reportes" class="rail-btn" title="Alertas Críticas">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </a>
      <a routerLink="/traslados" class="rail-btn" title="Traspasos">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </a>
      <span class="rail-vertical-label">QBA • SEDE #93</span>
    </div>
  </div>
</aside>
